name = "oscar-sync"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Zero-knowledge blob store. Create the KV namespace and paste its id:
#   npx wrangler kv namespace create OSCAR_KV
[[kv_namespaces]]
binding = "OSCAR_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Lock CORS to your deployed app origin(s) in production (comma-separated).
# Omit to allow any origin (fine for a bearer-authenticated API, but
# tighter is better).
[vars]
ALLOWED_ORIGIN = ""
